# Checks every pull request: students may only change their own game folder, and every game must follow the rules.
# Runs with read-only access and never runs a student's game code; it only reads the files.
name: Check games

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the games
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: node scripts/check-games.mjs
