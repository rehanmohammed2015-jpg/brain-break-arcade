<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Break Arcade</title>
<meta name="description" content="Free games for middle schoolers, including games made by students.">
<meta name="theme-color" content="#111329">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Look: a night-sky arcade. Navy panels, soft hairline borders, lime highlights, a mono font for little labels.
   Each game still owns one accent color, used for its card art and buttons. */
:root {
  --paper: #111329; --grid: #23264a; --ink: #f7f4ff; --ink-soft: #a5a4c2; --card: #1b1d3b; --card-2: #202343;
  --line: rgba(255,255,255,.1); --line-strong: rgba(255,255,255,.22); --shadow: #05060f;
  --lime: #cbf56a; --math: #86a9ff; --words: #ff9a6b; --memory: #78e5dc; --dash: #ff77b7; --stack: #b79cff; --pop: #6fc6ff;
  --p1: #ff7a7d; --good: #a7f57d; --bad: #ff6b7a; --gold: #ffd878; --on-accent: #15172b; --accent: var(--lime);
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "DM Mono", ui-monospace, Consolas, monospace;
  --radius: 18px; --bw: 1px;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  background-color: var(--paper);
  background-image: radial-gradient(ellipse at 78% -6%, #303365 0, transparent 38%), radial-gradient(ellipse at -10% 32%, #242951 0, transparent 28%);
  background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
a { color: inherit; }

/* ---------- top bar ---------- */
.topbar { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; padding: 10px 0; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; font-weight: 700; font-size: 20px; letter-spacing: -.8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; background: var(--lime); color: #17192d; display: grid; place-items: center; font-size: 19px; transform: rotate(-7deg); box-shadow: 0 6px 18px #cbf56a33; transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
.brand:hover .brand-mark { transform: rotate(8deg) scale(1.08); }
.brand b { color: var(--lime); font-weight: 700; }
.top-tools { display: flex; align-items: center; gap: 10px; }
.pill-note { font-family: var(--font-mono); font-size: 11px; letter-spacing: .6px; text-transform: uppercase; border: 1px solid var(--line); padding: 7px 12px; border-radius: 99px; color: #ffbd73; }

/* ---------- hero ---------- */
.hero { padding: 54px 0 34px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; }
.eyebrow { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 1.4px; font-size: 11px; color: var(--lime); display: flex; gap: 9px; align-items: center; margin: 0; }
.eyebrow::before { content: ''; height: 1px; width: 20px; background: currentColor; }
.hero h1 { font-size: clamp(44px, 6.4vw, 76px); line-height: .98; letter-spacing: -.065em; margin: 18px 0 20px; font-weight: 700; }
.hero h1 em { font-style: normal; color: var(--lime); }
.hero-copy { max-width: 470px; color: #b7b7ce; font-size: 16px; line-height: 1.7; margin: 0; }
.hero-actions { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
.hero-art { height: 290px; position: relative; display: grid; place-items: center; }
.orbit { position: absolute; width: 255px; height: 255px; border: 1px dashed #ffffff27; border-radius: 50%; animation: spin 32s linear infinite; }
.orbit::before, .orbit::after { content: ''; position: absolute; width: 8px; height: 8px; background: var(--dash); border-radius: 50%; top: 31px; left: 26px; box-shadow: 0 0 18px var(--dash); }
.orbit::after { background: var(--memory); top: auto; left: auto; bottom: 10px; right: 52px; box-shadow: 0 0 18px var(--memory); }
@keyframes spin { to { transform: rotate(360deg); } }
.planet { width: 160px; height: 160px; border-radius: 48% 52% 58% 42%; background: linear-gradient(145deg, #cbf56a, #75d7ab); box-shadow: 0 0 85px #9be6a233, inset -17px -20px 30px #467d7270; transform: rotate(-20deg); position: relative; animation: float 6s ease-in-out infinite; }
.planet::before { content: ''; position: absolute; width: 200px; height: 54px; border: 9px solid #fff4b5; border-radius: 50%; left: -26px; top: 53px; transform: rotate(-23deg); box-shadow: 0 0 24px #fff4b55c; }
.planet::after { content: '✦'; position: absolute; font-size: 30px; color: #fff7c5; right: -61px; top: -32px; transform: rotate(20deg); text-shadow: 0 0 20px #fff; }
@keyframes float { 50% { transform: rotate(-14deg) translateY(-8px); } }
.float-tag { position: absolute; background: #242644; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.32); }
.tag-a { top: 30px; left: 6px; transform: rotate(-7deg); }
.tag-b { right: 0; bottom: 40px; transform: rotate(5deg); }
.tag-b b { color: var(--lime); }

/* ---------- filter + sections ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 4px; position: sticky; top: 0; z-index: 5; background: linear-gradient(var(--paper) 70%, transparent); }
.filter { font-family: var(--font-mono); font-size: 12px; letter-spacing: .5px; text-transform: uppercase; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: #ffffff08; color: #c6c6db; cursor: pointer; transition: background-color .15s, color .15s, transform .12s; }
.filter:hover { background: #ffffff14; color: var(--ink); }
.filter[aria-pressed="true"] { background: var(--lime); color: #17192b; border-color: transparent; }
.filter:active { transform: scale(.96); }
.hub { display: flex; flex-direction: column; gap: 44px; padding: 26px 0 50px; }
.hub-section { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 60px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; }
.section-head h2 { font-size: 26px; letter-spacing: -.04em; margin: 6px 0 0; line-height: 1.1; }
.section-head p { font-size: 13px; color: var(--ink-soft); margin: 0; max-width: 46ch; }

/* ---------- cards ---------- */
.hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.gcard { background: linear-gradient(145deg, #202343, #191b36); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform .2s, border-color .2s, box-shadow .2s; }
.gcard:hover { transform: translateY(-5px); border-color: #ffffff43; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.gcard:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
.gcard-art {
  height: 160px; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden; padding: 0 12px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 26%, #1d1f40), color-mix(in srgb, var(--accent) 48%, #2a2652));
  color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 38px;
}
.gcard-art::before { content: ''; position: absolute; width: 190px; height: 190px; border-radius: 50%; border: 1px solid #ffffff25; box-shadow: 0 0 0 26px transparent, 0 0 0 27px #ffffff14; pointer-events: none; }
.gcard-art > * { position: relative; z-index: 1; filter: drop-shadow(0 8px 18px #0005); transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
.gcard:hover .gcard-art > * { transform: scale(1.07) rotate(-3deg); }
.gcard-body { padding: 16px 18px 15px; display: flex; flex-direction: column; flex: 1; }
.card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pill { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; padding: 6px 9px; border-radius: 99px; background: #ffffff0c; color: #c6c6db; white-space: nowrap; }
.pill.hot { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.time { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
.gcard h2 { font-size: 19px; letter-spacing: -.03em; margin: 13px 0 6px; line-height: 1.2; }
.gcard p { font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.play-row { border-top: 1px solid var(--line); margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; }
.gcard p + .play-row { margin-top: 15px; }
.best { font-size: 12px; color: var(--ink-soft); }
.best b { color: var(--ink); font-variant-numeric: tabular-nums; }
.play-arrow { color: var(--lime); font-size: 18px; font-weight: 700; transition: transform .2s; }
.gcard:hover .play-arrow { transform: translate(3px, -3px); }

/* Originals: a glowing banner band */
.hub-section.featured { border: 1px solid #a78bff55; border-radius: 22px; padding: clamp(18px, 3.5vw, 28px); background: radial-gradient(ellipse at 85% 30%, #6750bd55, transparent 40%), linear-gradient(110deg, #252448, #242347 55%, #372d64); position: relative; overflow: hidden; }
.hub-section.featured::before { content: '✧   ·   ✦   ·   ✧'; position: absolute; right: 28px; top: 20px; color: #e7ddff55; letter-spacing: 13px; animation: drift-stars 9s linear infinite; pointer-events: none; }
@keyframes drift-stars { 50% { transform: translate(8px, 14px); opacity: .5; } }
.hub-section.featured .eyebrow { color: #c7b5ff; }
.hub-section.featured .section-head p { color: #c2c1df; }
.hub-section.featured .gcard { background: linear-gradient(145deg, #2a2858, #1f1d45); border-color: #b8a5ff33; }
.gcard.featured .gcard-art { height: 190px; }

/* little art pieces used on cards */
.mini-tile { display: inline-grid; place-items: center; width: 40px; height: 46px; border-radius: 8px; background: #ffe39a; color: #3d3015; font-size: 22px; font-weight: 700; box-shadow: 0 5px 0 #b99a4d; }
.mini-tile:nth-child(3n+2) { background: #cbf56a; color: #2a3a10; box-shadow: 0 5px 0 #86a83a; }
.mini-tile:nth-child(3n) { background: #ff9cc8; color: #532442; box-shadow: 0 5px 0 #b45283; }
.mini-tile:nth-child(odd) { transform: rotate(-6deg); } .mini-tile:nth-child(even) { transform: rotate(5deg) translateY(-8px); }
.mini-card { display: inline-grid; place-items: center; width: 64px; height: 76px; border-radius: 10px; background: #f3efff; color: #2a2550; font-size: 24px; box-shadow: 0 6px 0 #9d93cf; }
.mini-card.q { background: var(--accent); color: var(--on-accent); }
.mini-card small { font-family: var(--font-body); font-size: 11px; font-weight: 700; display: block; margin-top: -10px; }

/* ---------- game page ---------- */
.game-page { display: flex; flex-direction: column; gap: 18px; padding: 26px 0 50px; }
.game-top { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
.game-title { font-size: clamp(26px, 5vw, 40px); letter-spacing: -.05em; line-height: 1.05; margin: 4px 0 0; }
.stage { background: var(--card); border: 1px solid var(--line-strong); border-radius: 22px; box-shadow: 0 24px 80px rgba(0,0,0,.32); padding: clamp(16px, 3.5vw, 30px); min-height: 440px; }
.play-canvas {
  display: block; width: min(100%, 420px, calc(70vh * 2 / 3)); height: auto; aspect-ratio: 2 / 3; margin: 16px auto 0;
  border: 1px solid var(--line-strong); border-radius: 16px; touch-action: none; background: #0c0e22; cursor: pointer; box-shadow: 0 18px 50px #0007;
}

.btn {
  font-family: var(--font-body); font-weight: 700; font-size: 15px; line-height: 1.2;
  background: #ffffff0c; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px;
  padding: 11px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .18s, filter .18s, background-color .15s;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.1); background-color: #ffffff16; }
.btn:active { transform: translateY(1px) scale(.98); }
.btn:focus-visible, .ws-tile:focus-visible, .ws-slot:focus-visible, .mm-card:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 22%, transparent); }
.btn.primary:hover { background: var(--accent); }
.btn.lime { background: var(--lime); color: #17192b; border-color: transparent; box-shadow: 0 8px 22px #cbf56a26; }
.btn.small { font-size: 13px; padding: 8px 13px; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }

.h2 { font-size: clamp(22px, 4vw, 30px); letter-spacing: -.04em; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
.intro p { margin: 0 0 6px; max-width: 62ch; color: var(--ink-soft); }
.level-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 22px; }
.level { flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; padding: 14px 16px; }
.level b { font-size: 18px; letter-spacing: -.02em; }
.level span { font-weight: 400; color: var(--ink-soft); }
.level small { margin-top: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
.level:hover b { color: var(--accent); }

.hud { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; justify-content: space-between; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { border: 1px solid var(--line); background: #ffffff07; border-radius: 12px; padding: 5px 13px; min-width: 80px; }
.stat small { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
.stat b { font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.timerbar { height: 10px; border-radius: 999px; overflow: hidden; margin-top: 14px; background: #ffffff12; }
.timerbar i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 999px; transition: width .2s linear, background-color .3s; box-shadow: 0 0 12px var(--accent); }
.timerbar.low i { background: var(--bad); }
.feedback { text-align: center; min-height: 28px; font-weight: 700; margin-top: 16px; }
.feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }

.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 12px; }
.result .big { font-size: clamp(60px, 14vw, 104px); font-weight: 700; letter-spacing: -.06em; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; text-shadow: 0 10px 40px color-mix(in srgb, var(--accent) 35%, transparent); }
.result .label { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--ink-soft); }
.result .newbest { background: var(--gold); color: #1A2238; font-weight: 700; padding: 5px 14px; border-radius: 999px; }
.result-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px 10px; }

.mode-pick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.mode-opt { font: inherit; font-weight: 600; font-size: 14px; padding: 7px 14px; border: 1px solid var(--line-strong); border-radius: 999px; background: #ffffff08; color: var(--ink); cursor: pointer; }
.mode-opt[aria-checked="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.mode-opt:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.site-foot { border-top: 1px solid var(--line); padding: 20px 0 30px; color: #8586a8; font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.site-foot strong { color: #c7c5dc; font-weight: 500; }

/* ---------- motion ---------- */
@keyframes rise-in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes drop-in { 0% { opacity: 0; transform: translateY(-34px) rotate(-8deg); } 60% { opacity: 1; transform: translateY(5px) rotate(2deg); } 100% { transform: none; } }
@keyframes slide-in { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateY(-3px) scale(1.04); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes fx-bit { from { transform: translate(-50%, -50%) scale(1); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2) rotate(200deg); opacity: 0; } }
.hero > div:first-child > * { animation: rise-in .6s cubic-bezier(.2,.9,.3,1.1) backwards; }
.hero > div:first-child > :nth-child(2) { animation-delay: .06s; } .hero > div:first-child > :nth-child(3) { animation-delay: .12s; } .hero > div:first-child > :nth-child(4) { animation-delay: .18s; }
.float-tag { animation: rise-in .6s ease .35s backwards; }
.section-head { animation: slide-in .45s ease backwards; }
.gcard { animation: rise-in .5s cubic-bezier(.2,.9,.3,1.15) backwards; animation-delay: calc(var(--i, 0) * 60ms + 60ms); }
.game-top { animation: slide-in .35s ease backwards; }
.stage { animation: rise-in .4s cubic-bezier(.2,.9,.3,1.1) backwards; }
.intro > *, .intro + .mode-pick, .level-grid > *, .result > * { animation: rise-in .4s ease backwards; }
.intro > :nth-child(2) { animation-delay: .06s; } .intro > :nth-child(3) { animation-delay: .12s; }
.level-grid > :nth-child(1) { animation-delay: .1s; } .level-grid > :nth-child(2) { animation-delay: .16s; }
.level-grid > :nth-child(3) { animation-delay: .22s; } .level-grid > :nth-child(4) { animation-delay: .28s; }
.level-grid > :nth-child(5) { animation-delay: .34s; }
.result > :nth-child(2) { animation: drop-in .6s cubic-bezier(.3,1.4,.5,1) .08s backwards; }
.result > :nth-child(3) { animation-delay: .25s; } .result > :nth-child(4) { animation-delay: .32s; }
.result > :nth-child(5) { animation-delay: .4s; } .result > :nth-child(6) { animation-delay: .48s; }
.result .newbest { animation: drop-in .6s cubic-bezier(.3,1.4,.5,1) .35s backwards, nudge 1.6s ease 1.2s infinite; }
.intro ~ .row .btn.primary, .intro + .mode-pick + .row .btn.primary { animation: nudge 2.2s ease 1s infinite; }
.stat b { display: inline-block; }
.stat b.bump { animation: bump .3s ease; }
.mode-opt { transition: background-color .15s, transform .12s; }
.mode-opt:active { transform: scale(.95); }
.fx-bit { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; border-radius: 2px; pointer-events: none; z-index: 3; animation: fx-bit .55s ease-out forwards; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
.shake { animation: shake .3s ease; }
.pop { animation: pop .35s ease; }

@media (max-width: 780px) {
  .hero { grid-template-columns: 1fr; gap: 0; padding-top: 36px; }
  .hero-art { height: 220px; }
  .orbit { width: 190px; height: 190px; }
  .planet { width: 120px; height: 120px; }
  .planet::before { width: 150px; left: -17px; top: 39px; height: 40px; }
  .tag-a { left: 8%; } .tag-b { right: 8%; }
}
@media (max-width: 540px) {
  .topbar .pill-note { display: none; }
  .hero h1 { font-size: 50px; }
  .gcard-art { height: 145px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="#" aria-label="Brain Break Arcade home"><span class="brand-mark" aria-hidden="true">✳</span><span>brain break <b>arcade</b></span></a>
    <div class="top-tools">
      <span class="pill-note" id="game-count"></span>
      <a class="btn small" href="#creators" id="creators-link">✦ Make a game</a>
      <button class="btn small" id="sound-toggle" type="button" aria-pressed="true">Sound on</button>
    </div>
  </header>
  <main id="app"></main>
  <footer class="site-foot"><span><strong>brain break arcade</strong> · quick games for grades 6 to 8</span><span>Best scores are saved in this browser only ✦</span></footer>
</div>

<script>
window.Arcade = (function () {
  const games = [];
  let cleanup = null;

  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem('bba:' + key); return v === null ? fallback : JSON.parse(v); }
      catch (e) { return fallback; }
    },

  function enhanceResult(node) {
    const big = node.querySelector('.big');
    if (big && /^\d+$/.test(big.textContent.trim()) && !reduced()) {
      const end = Number(big.textContent.trim());
      const t0 = performance.now(), dur = Math.min(1100, 400 + end * 4);
      big.textContent = '0';
      (function step(now) {
        const k = Math.min(1, (now - t0) / dur);
        big.textContent = Math.round(end * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    }
    const nb = node.querySelector('.newbest');
    if (nb && !/computer wins|try a different/i.test(nb.textContent)) setTimeout(() => confetti(), 250);
    else sound.play(nb ? 'lose' : 'blip');
  }

  function color(name) {
    return getComputedStyle(document.documentElement).getPropertyValue('--' + name).trim();
  }

  function renderGame(g) {
    const sec = SECTIONS.find(s => s.key === (g.section || 'learn'));
    app().innerHTML = `<div class="game-page" style="--accent:var(--${g.color})">
      <div class="game-top">
        <a class="btn small" href="#">&larr; All games</a>
        <div><p class="eyebrow">${sec ? sec.title : 'Game'} · ⏱ ${TIME[g.id] || 'quick'}</p><h2 class="game-title">${g.title}</h2></div>
      </div>
      <section class="stage" id="stage"></section>
    </div>`;
    cleanup = g.mount(document.getElementById('stage')) || null;
  }

  function route() {
    if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
    const id = location.hash.slice(1);
    if (window.Community) window.Community.leave();
    if (window.Community && window.Community.handles(id)) {
      const t = window.Community.route(id, app());
      document.title = t + ' · Brain Break Arcade';
      window.scrollTo(0, 0);
      return;
    }
    const g = games.find(x => x.id === id);
    if (g) renderGame(g); else renderHub();
    document.title = g ? g.title + ' · Brain Break Arcade' : 'Brain Break Arcade';
    window.scrollTo(0, 0);
  }

  function start() {
    document.getElementById('game-count').textContent = '✦ ' + games.length + ' games · free to play';
    // sound toggle + a soft click on every button
    const st = document.getElementById('sound-toggle');
    const label = () => { st.textContent = sound.isMuted() ? '🔇 Sound off' : '🔊 Sound on'; st.setAttribute('aria-pressed', String(!sound.isMuted())); };
    label();
    st.addEventListener('click', () => { sound.setMuted(!sound.isMuted()); label(); sound.play('click'); });
    document.addEventListener('click', e => { if (e.target.closest('.btn, .mode-opt, .gcard, .filter')) sound.play('click'); });
    // watch for result screens appearing in any game
    new MutationObserver(muts => {
      for (const m of muts) {
        // HUD numbers bounce when they change (not the ticking clocks)
        const t = m.target;
        if (t.nodeType === 1 && t.matches('.stat b') && !/time/.test(t.id) && !reduced()) {
          t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump');
        }
      }
      for (const m of muts) for (const n of m.addedNodes) {
        if (n.nodeType !== 1) continue;
        const r = n.matches('.result') ? n : n.querySelector && n.querySelector('.result');
        if (r) enhanceResult(r);
      }
    }).observe(document.getElementById('app'), { childList: true, subtree: true });
    window.addEventListener('hashchange', route);
    route();
  }

  return { register, store, shuffle, rand, css, start, makeCanvas, color, modePicker, particles, fxFrame, confetti, domBurst, sound, glow, crowd, applyFilter };
})();
